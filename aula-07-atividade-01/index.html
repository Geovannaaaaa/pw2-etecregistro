<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade01-Aula07</title>
</head>
<body>
    <h1>Atividade 01</h1>
</body>
<script>
    var nome = window.prompt("Caro usuário, por gentileza, digite seu nome: ");
    document.write(`Meu nome é: ${nome}`);
    
    var cidade = window.prompt("Agora, digite a sua cidade:");
    document.write(`<br> Eu moro em: ${cidade.toUpperCase()}`);

    var nascimento = Number(window.prompt("Digite o seu ano de nascimento: "));
    var ano = Number(window.prompt("Digite o ano atual: "));
    const idade = ano - nascimento;
    document.write(`<br> Minha idade é: ${idade}`);

    var salario = Number(window.prompt("E por fim, digite o seu salário, para que possamos converter para o dólar: "));
    var conversao = salario * 0.19;
    document.write(`<br> Meu salário convertido em dólares: ${conversao.toLocaleString('pt-br', {style: 'currency', currency: 'USD'})}`);

</script>
</html>
