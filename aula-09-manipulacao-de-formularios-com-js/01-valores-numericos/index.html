<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Formulários</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Calculadora com JavaScript</h1>
    <!-- Campos da Calculadora -->
    <h3>Insira dois números:</h3>
    <input type="number" name="n1" id="n1" min="0" max="666">
    <h3><strong>e</strong></h3>
    <input type="number" name="n2" id="n2" min="0" max="666">
    <h3>Selecione a operação:</h3>
    <input type="button" value="+" onclick="somar()">
    <input type="button" value="-" onclick="subtrair()">
    <input type="button" value="÷" onclick="dividir()">
    <input type="button" value="x" onclick="multiplicar()">
    <!-- Área de resultado -->
     <h3>Resultado:</h3>
    <div id="resultado"></div>
    <br>
    <br>
    <input type="button" value="Limpar" onclick="limpar()">

    <script src="script.js"></script>
</body>
</html>
